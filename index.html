<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zonic: Free Online Games</title>
<meta name="description" content="Play free online browser games on Zonic. No downloads, instant play on desktop and mobile.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://img.gamepix.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <a class="logo" href="#" id="home"><span class="mark"></span>Zonic</a>
    <input class="search" id="q" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
  </header>

  <main id="main">
    <section id="homeView">
      <div class="hero rise">
        <h1>Play free games instantly</h1>
        <p>Thousands of browser games. No downloads, no sign-up, on desktop and mobile.</p>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="status" id="status" role="status">Loading games…</div>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" type="button" hidden>Load more games</button>
    </section>

    <section id="playView" hidden>
      <a class="back" href="#" id="back">&larr; All games</a>
      <div class="stage" id="stage"></div>
      <div class="meta">
        <div><h1 id="pTitle"></h1><span class="tag" id="pCat"></span><span class="tag">Free to play</span></div>
        <button class="btn" id="fs" type="button">Fullscreen</button>
      </div>
      <p class="desc" id="pDesc"></p>
      <h2 class="sec">More games</h2>
      <div class="grid" id="related"></div>
    </section>
  </main>
  <noscript><p>Zonic needs JavaScript turned on to load games.</p></noscript>
</div>
<footer><div class="wrap">Zonic. Games provided by GamePix and Playgama. All game names and artwork belong to their owners.</div></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/sources.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
