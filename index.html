<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zonic: Free Online Games</title>
<meta name="description" content="Play free online browser games on Zonic. No downloads, instant play on desktop and mobile.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://img.gamepix.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#161a2e;--mute:#667085;--line:#e8eaf2;--soft:#f6f7fb;--a:#ff5a5f;--b:#ffb020;--c:#12b886;--d:#2f80ed;--e:#7c5cff}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.mesh{position:absolute;inset:0 0 auto 0;height:560px;z-index:-1;pointer-events:none;background:
radial-gradient(520px 260px at 10% 6%,rgba(255,90,95,.14),transparent 70%),
radial-gradient(480px 260px at 52% 0%,rgba(255,176,32,.16),transparent 70%),
radial-gradient(520px 280px at 92% 10%,rgba(47,128,237,.15),transparent 70%),
radial-gradient(420px 240px at 72% 58%,rgba(124,92,255,.10),transparent 70%)}
header{display:flex;align-items:center;gap:24px;padding:20px 0}
.logo{font-weight:800;font-size:24px;letter-spacing:-.04em;display:flex;align-items:center;gap:9px;text-decoration:none}
.mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(var(--a),var(--b),var(--c),var(--d),var(--e),var(--a))}
.search{margin-left:auto;width:min(320px,100%);padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.85);font:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--d);outline-offset:2px}
.hero{padding:34px 0 10px}
.hero h1{margin:0 0 10px;font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.045em;font-weight:800;max-width:14ch}
.hero p{margin:0;color:var(--mute);font-size:clamp(16px,2vw,19px);max-width:48ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:26px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.chip:hover{transform:translateY(-2px);border-color:#cfd3e4}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;padding:18px 0 28px}
.card{display:block;text-decoration:none;border-radius:18px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px)}
.cover{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;box-shadow:0 14px 28px -18px rgba(22,26,46,.45),0 0 0 1px rgba(22,26,46,.06)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .cover img{transform:scale(1.06)}
.g0{background:linear-gradient(135deg,#ff8a8e,#ffb020)}.g1{background:linear-gradient(135deg,#5aa7ff,#7c5cff)}.g2{background:linear-gradient(135deg,#3fd9a8,#2f80ed)}.g3{background:linear-gradient(135deg,#ffcf5a,#ff5a5f)}.g4{background:linear-gradient(135deg,#a58bff,#ff7ab6)}
.card h3{margin:11px 2px 0;font-size:15px;line-height:1.3;letter-spacing:-.01em}
.card small{margin:0 2px;color:var(--mute);font-size:13px;display:block}
.status{color:var(--mute);font-size:14px;padding:6px 0}
.more{display:block;margin:6px auto 56px;font:inherit;font-weight:700;font-size:15px;padding:13px 28px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s}
.more:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(22,26,46,.6)}
.more[hidden]{display:none}
.back{display:inline-flex;align-items:center;gap:8px;margin:8px 0 18px;padding:9px 16px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s}
.back:hover{background:#eceef7}
.stage{position:relative;aspect-ratio:16/9;background:#0e1020;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -28px rgba(22,26,46,.4),0 0 0 1px rgba(22,26,46,.06)}
.stage.portrait{aspect-ratio:3/4;max-height:78vh;margin:0 auto}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;max-height:none}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:22px 2px 0}
.meta h1{margin:0 0 8px;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.035em;line-height:1.1}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--mute);padding:5px 12px;border-radius:99px;background:var(--soft);margin-right:6px}
.btn{font:inherit;font-weight:700;font-size:15px;padding:12px 22px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer;flex-shrink:0;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(22,26,46,.6)}
.desc{max-width:70ch;color:var(--mute);margin:22px 2px 0;padding-top:22px;border-top:1px solid var(--line)}
.desc:empty{display:none}
h2.sec{font-size:22px;letter-spacing:-.02em;margin:44px 0 0}
footer{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--mute);font-size:14px}
[hidden]{display:none!important}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
@media(max-width:700px){.wrap{padding:0 16px}header{flex-wrap:wrap;gap:14px}.search{margin-left:0;width:100%;order:3}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.meta{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <a class="logo" href="#" id="home"><span class="mark"></span>Zonic</a>
    <input class="search" id="q" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
  </header>

  <main id="main">
    <section id="homeView">
      <div class="hero rise">
        <h1>Play free games instantly</h1>
        <p>Hundreds of browser games. No downloads, no sign-up, on desktop and mobile.</p>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="status" id="status" role="status">Loading games…</div>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" type="button" hidden>Load more games</button>
    </section>

    <section id="playView" hidden>
      <a class="back" href="#" id="back">&larr; All games</a>
      <div class="stage" id="stage"></div>
      <div class="meta">
        <div><h1 id="pTitle"></h1><span class="tag" id="pCat"></span><span class="tag">Free to play</span></div>
        <button class="btn" id="fs" type="button">Fullscreen</button>
      </div>
      <p class="desc" id="pDesc"></p>
      <h2 class="sec">More games</h2>
      <div class="grid" id="related"></div>
    </section>
  </main>
  <noscript><p>Zonic needs JavaScript turned on to load games.</p></noscript>
</div>
<footer><div class="wrap">Zonic. Games provided by GamePix. All game names and artwork belong to their owners.</div></footer>

<script>
(function(){
'use strict';
var SID='Z1887';
var API='https://feeds.gamepix.com/v2/json';
var PER=48;

var SNAP=[
['Bus Driver Simulator 3D','bus-driver-simulator-3d','simulation','all'],
['Prism Match 3D','prism-match-3d','match-3','all'],
['Drop Planets','drop-planets','puzzle','portrait'],
['Defend the Castle','defend-the-castle','strategy','portrait'],
['Garden Master','garden-master','farming','portrait'],
['Quarantine Zombies','quarantine-zombies','zombie','all'],
['Stack Rocket','stack-rocket','building','portrait'],
['Nova Hop','nova-hop','hyper-casual','portrait'],
['Ancient Armies vs Modern Weapons','ancient-armies-vs-modern-weapons','battle','all'],
['Boost Balloon','boost-balloon','casual','portrait'],
['Combat Landing','combat-landing','airplane','all'],
['Billiards on Ice','billiards-on-ice','sports','all'],
['Vegan Quest','vegan-quest','arcade','portrait']
];

var $=function(id){return document.getElementById(id)};
var games=[],byNs={},nextUrl=null,cat='all',query='',live=false;

function coverUrl(ns){return 'https://img.gamepix.com/games/'+ns+'/cover/'+ns+'.png?w=320'}
function pretty(s){s=String(s||'').replace(/-/g,' ');return s.charAt(0).toUpperCase()+s.slice(1)}
function hashIdx(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%5}
function add(g){if(!g.ns||byNs[g.ns])return false;byNs[g.ns]=g;games.push(g);return true}
function fromSnap(){SNAP.forEach(function(r){add({title:r[0],ns:r[1],cat:r[2],orient:r[3],desc:'',img:coverUrl(r[1])})})}
function fromFeed(it){return{title:it.title||pretty(it.namespace),ns:it.namespace,cat:it.category||'games',orient:it.orientation||'all',desc:it.description||'',img:it.banner_image||coverUrl(it.namespace)}}

function transition(fn){
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches){document.startViewTransition(fn)}else{fn()}
}

function card(g){
  var a=document.createElement('a');a.className='card';a.href='#/play/'+g.ns;
  var c=document.createElement('div');c.className='cover g'+hashIdx(g.ns);
  var im=document.createElement('img');im.loading='lazy';im.decoding='async';im.alt=g.title;im.src=g.img;
  im.onerror=function(){im.remove()};
  c.appendChild(im);
  var h=document.createElement('h3');h.textContent=g.title;
  var s=document.createElement('small');s.textContent=pretty(g.cat);
  a.appendChild(c);a.appendChild(h);a.appendChild(s);
  return a;
}

function filtered(){
  var q=query.trim().toLowerCase();
  return games.filter(function(g){
    return (cat==='all'||g.cat===cat)&&(!q||g.title.toLowerCase().indexOf(q)>-1);
  });
}

function renderChips(){
  var counts={};games.forEach(function(g){counts[g.cat]=(counts[g.cat]||0)+1});
  var list=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).slice(0,14);
  var box=$('chips');box.innerHTML='';
  ['all'].concat(list).forEach(function(k){
    var b=document.createElement('button');b.type='button';b.className='chip';
    b.textContent=k==='all'?'All games':pretty(k);
    b.setAttribute('aria-pressed',String(k===cat));
    b.onclick=function(){cat=k;renderChips();renderGrid()};
    box.appendChild(b);
  });
}

function renderGrid(){
  var grid=$('grid'),list=filtered();
  grid.innerHTML='';
  var frag=document.createDocumentFragment();
  list.forEach(function(g){frag.appendChild(card(g))});
  grid.appendChild(frag);
  $('status').textContent=list.length?'':'No games found. Try another search or category.';
  $('more').hidden=!(nextUrl&&cat==='all'&&!query.trim());
}

function loadPage(url){
  var btn=$('more');btn.disabled=true;
  return fetch(url).then(function(r){if(!r.ok)throw new Error('feed '+r.status);return r.json()})
  .then(function(j){
    (j.items||[]).forEach(function(it){add(fromFeed(it))});
    nextUrl=j.next_url||null;live=true;
  })
  .catch(function(){
    if(!games.length){fromSnap();nextUrl=null}
  })
  .then(function(){btn.disabled=false;renderChips();renderGrid()});
}

function startUrl(){return API+'?sid='+encodeURIComponent(SID)+'&order=quality&page=1&pagination='+PER}

function showPlay(ns){
  var g=byNs[ns]||{title:pretty(ns),ns:ns,cat:'games',orient:'all',desc:''};
  $('homeView').hidden=true;$('playView').hidden=false;
  document.title=g.title+' | Zonic';
  $('pTitle').textContent=g.title;
  $('pCat').textContent=pretty(g.cat);
  $('pDesc').textContent=g.desc||'';
  var st=$('stage');st.innerHTML='';
  st.className='stage'+(g.orient==='portrait'?' portrait':'');
  var f=document.createElement('iframe');
  f.title=g.title;
  f.allow='fullscreen; autoplay; gamepad; accelerometer; gyroscope';
  f.setAttribute('allowfullscreen','');
  f.src='https://play.gamepix.com/'+encodeURIComponent(ns)+'/embed?sid='+encodeURIComponent(SID);
  st.appendChild(f);
  var rel=games.filter(function(x){return x.ns!==ns&&x.cat===g.cat});
  if(rel.length<8)rel=rel.concat(games.filter(function(x){return x.ns!==ns&&x.cat!==g.cat}));
  var box=$('related');box.innerHTML='';
  rel.slice(0,8).forEach(function(x){box.appendChild(card(x))});
  window.scrollTo(0,0);
}

function showHome(){
  $('playView').hidden=true;$('homeView').hidden=false;
  $('stage').innerHTML='';
  document.title='Zonic: Free Online Games';
}

function route(){
  var m=/^#\/play\/([a-z0-9._-]+)$/i.exec(location.hash);
  transition(function(){m?showPlay(m[1]):showHome()});
}

$('home').addEventListener('click',function(e){e.preventDefault();query='';$('q').value='';cat='all';history.pushState(null,'',location.pathname+location.search);route();renderChips();renderGrid()});
$('back').addEventListener('click',function(e){e.preventDefault();history.pushState(null,'',location.pathname+location.search);route()});
$('q').addEventListener('input',function(){
  query=this.value;
  if(!$('playView').hidden){history.pushState(null,'',location.pathname+location.search);route()}
  renderGrid();
});
$('more').addEventListener('click',function(){if(nextUrl)loadPage(nextUrl)});
$('fs').addEventListener('click',function(){
  var s=$('stage');
  try{(s.requestFullscreen||s.webkitRequestFullscreen).call(s)}catch(e){}
});
window.addEventListener('hashchange',route);

fromSnap();
renderChips();renderGrid();route();
loadPage(startUrl());
})();
</script>
</body>
</html>
